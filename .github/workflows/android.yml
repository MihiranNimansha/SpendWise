name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          # The committed gradlew script and gradle-wrapper.jar do not match each other (the script
          # starts the JAR with `java -jar`, the JAR has no Main-Class), so ./gradlew cannot start.
          # CI therefore installs the Gradle version named in gradle-wrapper.properties and calls
          # `gradle` directly. Once the wrapper is regenerated (./gradlew wrapper
          # --gradle-version 8.13 from Android Studio's terminal) switch back to ./gradlew and
          # remove validate-wrappers: false.
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Build the debug APK
        run: gradle assembleDebug --stacktrace

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spendwise-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
